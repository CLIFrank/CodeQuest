name: Build CodeQuest releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows-x64
            executable: dist/CodeQuest/CodeQuest.exe
          - runner: ubuntu-latest
            label: Linux-x64
            executable: dist/CodeQuest/CodeQuest
          - runner: macos-latest
            label: macOS-native
            executable: dist/CodeQuest.app/Contents/MacOS/CodeQuest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm CodeQuest.spec

      - name: Run frozen self-test
        run: python packaging/run_frozen_self_test.py --executable "${{ matrix.executable }}"

      - name: Package release archive
        run: python packaging/package_release.py --label "${{ matrix.label }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-${{ matrix.label }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "CodeQuest $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip --clobber
